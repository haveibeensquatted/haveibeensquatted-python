[project]
name = "hibs-examples"
version = "0.0.0"
description = "Standalone CLI examples for the haveibeensquatted Python SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "haveibeensquatted",
]

[tool.uv]
package = false
# 14d dependency cooldown
exclude-newer = "P14D"

[tool.uv.sources]
haveibeensquatted = { path = "..", editable = true }
